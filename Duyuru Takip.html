.tabupd{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 10px;margin:8px 0 2px}
.tudate{font:500 .8rem var(--f-mono);color:var(--muted)}
.tumsg{font-size:.78rem;color:var(--muted)} .tumsg.err{color:var(--warn)} .tumsg.ok{color:var(--ok)}
.tubtn{padding:4px 11px;font-size:.82rem}
@media (max-width:640px){.tabupd{justify-content:flex-start}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Duyuru Takip</h1>
      <div class="sub" id="upd">Son kontrol: bekleniyor</div>
    </div>
    <div class="mastr">
      <div class="oalert" id="oalert" role="status" aria-live="polite" hidden></div>
      <button type="button" class="refresh" id="refresh" hidden>Tümünü yenile</button>
      <div class="sum" id="sum"></div>
      <div class="rmsg" id="rmsg" role="status" aria-live="polite"></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Kategoriler"></nav>

  <div class="tabupd" id="tabupd" aria-label="Bu sayfanın güncelleme durumu"></div>

  <nav class="subtabs" id="subnav" hidden aria-label="Alt sayfalar"></nav>
  <section id="tayinView" hidden aria-label="Tayin"></section>
  <section id="oyunView" class="oyv" hidden aria-label="Ücretsiz oyunlar"></section>
  <section id="izleView" class="oyv" hidden aria-label="İzlenmesi gerekenler"></section>
  <section id="osymView" class="oyv" hidden aria-label="ÖSYM takvim"></section>

  <div class="bar" id="bar">
    <div class="seg" role="group" aria-label="Zaman aralığı">
      <button type="button" id="r7" aria-pressed="true">Son 7 gün</button>
      <button type="button" id="r30" aria-pressed="false">Son 30 gün</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Tüm sekmelerde ara" aria-label="Duyurularda ara" autocomplete="off">
    <div class="tools">
      <label class="chk"><input type="checkbox" id="onlyPri"> Sadece öncelikliler</label>
      <label class="chk"><input type="checkbox" id="hideRead"> Okunanları gizle</label>
      <label class="chk"><input type="checkbox" id="showArch"> Arşivi göster</label>
    </div>
  </div>

  <ul class="list" id="list"><li class="empty">Duyurular yükleniyor…</li></ul>

  <section class="side" id="side">
    <div class="panel">
      <h2>Öncelik kelimeleri</h2>
      <div class="chips" id="kwChips"></div>
      <form class="add" id="kwForm">
        <input id="kwInput" type="text" placeholder="Kelime ekle (ör. aday hakem)" autocomplete="off">
        <button type="submit">Ekle</button>
      </form>
      <p class="note" id="kwNote">Bu sekmede başlığında bu kelimelerden biri geçen duyurular çerçeveyle işaretlenir ve günlük kontrolde telefonunuza bildirim gider.</p>
    </div>
    <div class="panel">
      <h2>Kaynaklar</h2>
      <ul class="srcs" id="srcs"></ul>
      <p class="note">Her sabah otomatik kontrol edilir.</p>
    </div>
  </section>
</div>

<script>
const SVG=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICONS={

  universite:SVG('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/>'),

  bilirkisi:SVG('<path d="M12 4v16M7 20h10M5 7h14"/><path d="M5 7l-3 6a3 3 0 0 0 6 0z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0z"/>'),
  oyun:SVG('<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="13.8" r="1" fill="currentColor"/>'),
  tayin:SVG('<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>'),

};
const CAL_ICON=SVG('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>');
const TABS=[
  {id:"spor",label:"Spor Federasyonları"},
  {id:"bilirkisi",label:"Bilirkişi"},
  {id:"universite",label:"Üniversite"},
  {id:"saglik",label:"Sağlık Bakanlığı"},
  {id:"tayin",label:"Tayin"},
  {id:"toki",label:"TOKİ"},

];
const GROUPS={bilirkisi:[{id:"adalet",label:"Adalet · Bilirkişilik"},{id:"barolar",label:"Barolar"}]};
const SUBLABEL={adalet:"Bilirkişi · Adalet",barolar:"Bilirkişi · Barolar"};
function dtab(){const g=GROUPS[S.tab];return g?(S.sub[S.tab]||g[0].id):S.tab}
function uiTab(t){for(const k in GROUPS)if(GROUPS[k].some(x=>x.id===t))return k;return t}
const SOURCES={
  spor:[
    {id:"tvf",name:"Voleybol (TVF)",url:"https://tvf.org.tr/icerikler/tvf-duyurular"},
    {id:"tvf-mhgk",name:"Voleybol hakem (MHGK)",url:"https://tvf.org.tr/icerikler/mhgk-duyurular/"},
    {id:"badminton",name:"Badminton (TBF)",url:"https://www.badminton.org.tr/duyurular/"},
    {id:"tyf",name:"Yüzme (TYF)",url:"https://www.tyf.gov.tr/haberler/"},
    {id:"tyf-hakem",name:"Yüzme hakem kursları",url:"https://www.tyf.gov.tr/hakem-islemleri/kurslar.html"},
    {id:"tmtf",name:"Masa Tenisi (TMTF)",url:"https://tmtf.gov.tr/duyurular"},

    {id:"bilardo-mhk",name:"Bilardo hakem kurulu (MHK)",url:"https://mhk.bilardo.gov.tr/"},
    {id:"bilardo",name:"Bilardo",url:"https://www.bilardo.org.tr/duyurular.html"},
    {id:"ordu-gsim",name:"Ordu Gençlik ve Spor İl Müd.",url:"https://ordu.gsb.gov.tr/"}
  ],
  barolar:[
    {id:"giresun-baro",name:"Giresun Barosu",url:"https://www.giresunbarosu.org.tr/Haberler"},
    {id:"ordu-baro",name:"Ordu Barosu",url:"https://www.ordubarosu.org.tr/TumHaberler"}
  ],
  universite:[{id:"giresun-sbe",name:"Giresun Üni. Sosyal Bilimler Enst.",url:"https://sbe.giresun.edu.tr/tr/news"}],
  saglik:[{id:"yhgm",name:"Yönetim Hizmetleri Genel Müd.",url:"https://yhgm.saglik.gov.tr/TR-10084/duyurular.html"},
    {id:"giresun-ism",name:"Giresun İl Sağlık Müd.",url:"https://giresunism.saglik.gov.tr/TR-22137/duyurular.html"},
    {id:"sgb",name:"Strateji Geliştirme Bşk.",url:"https://sgb.saglik.gov.tr/TR-59029/duyurular.html"},
    {id:"sbsgm",name:"Sağlık Bilgi Sistemleri GM (SBSGM)",url:"https://sbsgm.saglik.gov.tr/TR-1283/duyurular.html"},
    {id:"khgm",name:"Kamu Hastaneleri GM (KHGM)",url:"https://khgm.saglik.gov.tr/TR-39978/duyurular.html"}],
  adalet:[{id:"bilirkisi",name:"Bilirkişilik Daire Başkanlığı",url:"https://bilirkisilik.adalet.gov.tr/Home/TumHaberler/1"},

    {id:"samsun-bbk",name:"Samsun Bilirkişilik Bölge Kurulu (Ordu)",url:"https://samsunbbk.adalet.gov.tr/Arsiv/duyuru"},
    {id:"bilirkisi-egitim",name:"Temel eğitim duyuruları (Karadeniz)",url:"https://bilirkisilik.adalet.gov.tr/Home/SayfaDetay/egitim-kuruluslari02072020025435"}],
  tayin:[{id:"yhgm-bhg",name:"YHGM Bölge Hizmet Grupları",url:"https://yhgm.saglik.gov.tr/TR-34970/bolge-hizmet-gruplari.html"}],
  toki:[{id:"toki-satis",name:"TOKİ Satış Duyuruları",url:"https://www.toki.gov.tr/satis/tr/duyurular"},
    {id:"toki-haber",name:"TOKİ Haberler",url:"https://www.toki.gov.tr/haberler"}],
  onual:[{id:"onual",name:"Onu Al – indirime giren ürünler",url:"https://onual.com/"}]
};
const DEFAULT_KW={spor:["hakem","görevlendirme","toplantı","mhgk","mhk","gözlemci"],barolar:[],universite:[],saglik:[],adalet:["toplantı","alım","şart","kadro","başvuru","ilan","sınav"],tayin:[],toki:["giresun","samsun","ordu"],onual:[]};
const MONTHS=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const S={watch:[],items:[],kw:null,status:null,tayin:null,tayinHist:[],tayinDonem:[],tayinCal:{},tayinMeta:null,tab:"spor",sub:{},range:7,onlyPri:false,loaded:false,db:null,canWrite:true,imgOpen:null,imgCache:{}};
const $=id=>document.getElementById(id);
const low=s=>(s||"").toLocaleLowerCase("tr");
const today=()=>new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Istanbul"}));
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cutoff(days){const d=today();d.setDate(d.getDate()-days);return iso(d)}
function key(it){return it.date||(it.baseline||!it.seen?"":it.seen.slice(0,10))}
function fmt(k){if(!k)return"tarih yok";const[y,m,d]=k.split("-");return Number(d)+" "+MONTHS[Number(m)-1]+" "+y}
function kwFor(tab){const k=S.kw||DEFAULT_KW;return Array.isArray(k[tab])?k[tab]:(DEFAULT_KW[tab]||[])}
function matches(it){const t=low(it.title);return kwFor(it.tab).filter(w=>w&&t.includes(low(w)))}
function inRange(it,days){const k=key(it);return k&&k>=cutoff(days)}

function el(tag,attrs,...kids){const e=document.createElement(tag);for(const[a,v]of Object.entries(attrs||{})){if(a==="class")e.className=v;else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else e.setAttribute(a,v)}for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}

function renderTabs(){
  const nav=$("tabs");nav.textContent="";
  for(const t of TABS){
    const pri=t.id==="osym"?osymSoon().length:t.id==="izle"?S.watch.filter(v=>!v.archived).length:S.items.filter(i=>uiTab(i.tab)===t.id&&!i.archived&&inRange(i,S.range)&&matches(i).length).length;
    const b=el("button",{class:"tab",role:"tab","aria-selected":String(S.tab===t.id),type:"button",onclick:()=>{location.hash=t.id}},t.label,pri?el("span",{class:"n","aria-label":pri+(t.id==="izle"?" izlenecek":t.id==="osym"?" sınava 10 gün kala":" öncelikli")},String(pri)):null);
    b.insertAdjacentHTML("afterbegin",ICONS[t.id]);
    nav.append(b);
  }
}
function renderSummary(){
  const box=$("sum");box.textContent="";
  const wk=S.items.filter(i=>!i.archived&&i.tab!=="onual"&&inRange(i,7));
  const pri=wk.filter(i=>matches(i).length).length;
  box.append(el("span",{class:"pill"},wk.length+" duyuru bu hafta"));
  box.append(el("span",{class:"pill"+(pri?" pri":"")},pri+" öncelikli"));
  const up=$("upd");
  if(S.status&&S.status.runAt){const d=new Date(S.status.runAt);up.textContent="Son kontrol: "+d.toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}
  else up.textContent=S.loaded?"Son kontrol: ilk otomatik kontrol bekleniyor":"Son kontrol: yükleniyor";
}
function renderList(){
  const ul=$("list");ul.textContent="";
  if(!S.loaded){ul.append(el("li",{class:"empty"},S.db===false?"Duyurular bu görünümde yüklenemedi. Sayfayı claude.ai üzerinden açın.":"Duyurular yükleniyor…"));return}
  const q=low(S.q.trim());
  let rows=q?S.items.filter(i=>low(i.title).includes(q)):S.items.filter(i=>i.tab===dtab()&&inRange(i,S.range));
  rows=rows.filter(i=>S.showArch?i.archived:!i.archived);
  if(S.onlyPri)rows=rows.filter(i=>matches(i).length);
  if(S.hideRead)rows=rows.filter(i=>!i.read);
  rows.sort((a,b)=>key(b).localeCompare(key(a))||(b.seen||"").localeCompare(a.seen||""));
  if(!rows.length){
    ul.append(el("li",{class:"empty"},q?"Aramanızla eşleşen duyuru yok.":S.showArch?"Arşivde duyuru yok.":S.onlyPri?"Bu aralıkta öncelikli duyuru yok.":S.hideRead?"Okunmamış duyuru kalmadı.":"Bu aralıkta yeni duyuru yok. Kaynakların son paylaşımları için 30 güne geçin."));
    return;
  }
  const tabName=Object.assign({},...TABS.map(t=>({[t.id]:t.label})),SUBLABEL);
  const srcName={};for(const k of Object.keys(SOURCES))for(const s of SOURCES[k])srcName[s.id]=s.name;
  const recent=cutoff(1);
  for(const it of rows){
    const m=matches(it);
    const meta=el("div",{class:"meta"},el("span",{class:"src"},srcName[it.source]||it.source));
    if(it.seen&&it.seen.slice(0,10)>=recent&&!it.baseline)meta.append(el("span",{class:"new"},"YENİ"));
    if(m.length){meta.prepend(el("span",{class:"flag"},"Öncelikli"));for(const w of m)meta.append(el("span",{class:"kw"},w))}
    if(q)meta.prepend(el("span",{class:"tabname"},tabName[it.tab]||""));
    if(it.keyDate)meta.append(el("span",{class:"kdate",title:"Duyurudan çıkarılan tarih"},(it.keyDateLabel||"Tarih")+": "+fmt(it.keyDate)+(it.keyTime?" "+it.keyTime:"")));
    const a=el("a",{class:"t",href:it.url,target:"_blank",rel:"noopener",onclick:()=>{if(!it.read)setFlag(it,{read:true})}},it.title);
    const cb=el("button",{type:"button",class:"calbtn mini"+(it.calAdded?" done":""),"aria-expanded":String(S.calOpen===it._id),onclick:()=>{S.calOpen=S.calOpen===it._id?null:it._id;S.calMsg=null;S.calDate=null;S.calTime=null;render()}},it.calAdded?"Takvimde":"Takvime ekle");
    cb.insertAdjacentHTML("afterbegin",CAL_ICON);
    const rd=el("button",{type:"button",class:"mini rdbtn"+(it.read?" on":""),onclick:()=>setFlag(it,{read:!it.read})},it.read?"Okunmadı yap":"Okundu");
    const ar=el("button",{type:"button",class:"mini arbtn"+(it.archived?" on":""),onclick:()=>setFlag(it,{archived:!it.archived})},it.archived?"Arşivden çıkar":"Arşivle");
    const acts=S.canWrite?el("div",{class:"acts"},cb,rd,ar):el("div",{class:"acts"},cb);
    const gi=Array.isArray(it.imgs)?it.imgs:[];
    if(gi.length)acts.prepend(el("button",{type:"button",class:"gbtn","aria-expanded":String(S.imgOpen===it._id),title:"Duyurudaki görsel (anahtar kelimenle ilgili)",onclick:()=>{S.imgOpen=S.imgOpen===it._id?null:it._id;render()}},"🖼 Görsel"+(gi.length>1?" ("+gi.length+")":"")));
    meta.append(acts);
    const body=el("div",{class:"b"},a,meta);
    if(gi.length&&S.imgOpen===it._id)body.append(imgPanel(it,gi));
    if(S.calOpen===it._id)body.append(calPanel(it,srcName[it.source]||it.source));
    ul.append(el("li",{class:"row"+(m.length?" prio":"")+(it.read?" read":"")},el("div",{class:"d"},fmt(key(it))),body));
  }
}
function imgPanel(it,ids){
  const box=el("div",{class:"gpanel"});
  if(it.imgNote)box.append(el("div",{class:"gnote"},"Görselde: "+it.imgNote));
  const wrap=el("div",{class:"gimgs"});box.append(wrap);
  let wait=false;
  for(const id of ids){
    if(typeof id==="string"&&/^g\/[a-z0-9_-]+\.(webp|jpe?g|png)$/i.test(id)){wrap.append(el("img",{src:id,alt:it.title,onclick:()=>showBig(id)}));continue}
    const c=S.imgCache[id];
    if(c&&c.data)wrap.append(el("img",{src:c.data,alt:it.title,onclick:()=>showBig(c.data)}));
    else if(c&&c.err)wrap.append(el("div",{class:"gmsg"},"Görsel yüklenemedi."));
    else{wait=true;if(!c)loadImg(id)}
  }
  if(wait)box.append(el("div",{class:"gmsg"},"Görsel yükleniyor…"));
  box.append(el("div",{class:"gmsg"},el("a",{href:it.url,target:"_blank",rel:"noopener"},"Duyurunun aslını aç")));
  return box;
}
function loadImg(id){
  S.imgCache[id]={loading:true};
  if(!S.db){S.imgCache[id]={err:true};return}
  S.db.doc("gorsel/"+id).get().then(s=>{const d=s&&s.exists?s.data():null;S.imgCache[id]=d&&typeof d.data==="string"&&d.data.startsWith("data:image/")?{data:d.data}:{err:true};render()}).catch(()=>{S.imgCache[id]={err:true};render()});
}
function showBig(src){
  const ov=el("div",{class:"gov",role:"dialog","aria-label":"Görsel"},el("img",{src,alt:""}));
  const k=e=>{if(e.key==="Escape")close()};
  function close(){ov.remove();document.removeEventListener("keydown",k)}
  ov.addEventListener("click",close);document.addEventListener("keydown",k);
  document.body.append(ov);
}
function calPanel(it,srcLabel){
  const t=iso(today());const def=(it.keyDate&&it.keyDate>=t)?it.keyDate:(it.date&&it.date>=t)?it.date:t;
  if(S.calTime==null&&it.keyTime&&it.keyDate&&it.keyDate>=t)S.calTime=it.keyTime;
  const d=el("input",{type:"date",id:"calDate",value:S.calDate||def,"aria-label":"Tarih"});
  const tm=el("input",{type:"time",id:"calTime",value:S.calTime||"","aria-label":"Saat (boş bırakılırsa tüm gün)"});
  d.oninput=()=>{S.calDate=d.value};tm.oninput=()=>{S.calTime=tm.value};
  const go=el("button",{type:"button",class:"go"},"Ekle");
  const msg=el("div",{class:"msg"+(S.calMsg?" "+S.calMsg.kind:"")});
  if(S.calMsg){msg.textContent=S.calMsg.text;if(S.calMsg.link)msg.append(" ",el("a",{href:S.calMsg.link,target:"_blank",rel:"noopener"},"Google Takvim'de aç"))}
  else msg.textContent=(it.keyDate&&it.keyDate>=t?(it.keyDateLabel||"Tarih")+" duyurudan alındı; bir gün önce hatırlatma kurulur. ":"")+"Saat boş kalırsa tüm gün etkinlik olarak eklenir.";
  go.onclick=()=>addToCalendar(it,srcLabel,d.value,tm.value,go);
  return el("div",{class:"calpanel"},d,tm,go,msg);
}
function gcalLink(it,srcLabel,date,time){
  const p=n=>String(n).padStart(2,"0");
  let dates;
  if(time){const s=new Date(date+"T"+time);const e=new Date(s.getTime()+3600000);const f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+"T"+p(x.getHours())+p(x.getMinutes())+"00";dates=f(s)+"/"+f(e)}
  else{const s=new Date(date+"T00:00");const e=new Date(s.getTime()+86400000);const f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());dates=f(s)+"/"+f(e)}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(it.title)+"&dates="+dates+"&ctz=Europe/Istanbul&details="+encodeURIComponent(srcLabel+"\n"+it.url);
}
async function addToCalendar(it,srcLabel,date,time,btn){
  if(!date){S.calMsg={kind:"err",text:"Önce bir tarih seçin."};render();return}
  const link=gcalLink(it,srcLabel,date,time);
  if(!S.mcp){S.calMsg={kind:"",text:"Doğrudan ekleme bu görünümde kullanılamıyor.",link};render();return}
  btn.disabled=true;btn.textContent="Ekleniyor…";

  {id:"yds-2027-2",ex:"YDS",name:"2027-YDS/2",date:"2027-11-21",basvuru:"5–13 Eki 2027",sonuc:"2027-12-10"},
  {id:"ales-2027-3",ex:"ALES",name:"2027-ALES/3",date:"2027-11-28",basvuru:"12–20 Eki 2027",sonuc:"2027-12-17"},
  {id:"kpss-onlisans-2028",ex:"KPSS Ön Lisans",name:"2028-KPSS Ön Lisans",date:"2028-10-01",est:true,note:"2027'de yapılmıyor (iki yılda bir, çift yıllarda). 2026'da 4 Ekim'deydi; kesin tarih ÖSYM'nin 2028 takviminde (Ekim 2027 civarı) çıkar."},
  {id:"kpss-ortaogretim-2028",ex:"KPSS Ortaöğretim",name:"2028-KPSS Ortaöğretim",date:"2028-10-22",est:true,note:"2027'de yapılmıyor (iki yılda bir, çift yıllarda). 2026'da 25 Ekim'deydi; kesin tarih ÖSYM'nin 2028 takviminde çıkar."}
];
const OSYM_EXAMS=["KPSS Ortaöğretim","KPSS Lisans","KPSS Ön Lisans","YKS (TYT)","MSÜ","DGS","ALES","YDS"];
S.osymAr={};S.ofilt="aktif";S.osymTop=true;
try{if(localStorage.getItem("osymTop")==="0")S.osymTop=false}catch(_){}
function oDays(k){return Math.round((Date.parse(k+"T00:00:00Z")-Date.parse(iso(today())+"T00:00:00Z"))/864e5)}
function oLast(o){return o.end||o.date}
function oUp(){return OSYM.filter(o=>oDays(oLast(o))>=0).sort((a,b)=>a.date.localeCompare(b.date))}
function osymSoon(){return oUp().filter(o=>!S.osymAr[o.id]&&oDays(o.date)<=10)}
function oWhen(o){return o.end?fmtLong(o.date)+" – "+fmtLong(o.end):fmtLong(o.date)+(o.time?" "+o.time:"")}
function oLeft(o){const d=oDays(o.date);return d>0?d+" gün kaldı":d===0?"Bugün":"Sürüyor"}
let osymSaving=Promise.resolve();
function osymArch(o){
  const n=Object.assign({},S.osymAr);if(n[o.id])delete n[o.id];else n[o.id]=new Date().toISOString().slice(0,10);
  S.osymAr=n;render();
  if(S.db)osymSaving=osymSaving.then(()=>S.db.doc("osym/arsiv").set(n)).catch(e=>{if(e&&e.code==="invalid_argument"){S.canWrite=false;render()}});
}
function oArBtn(o){if(!S.canWrite||!S.db)return null;const on=!!S.osymAr[o.id];return el("button",{type:"button",class:"mini arbtn"+(on?" on":""),onclick:()=>osymArch(o)},on?"Arşivden çıkar":"Arşivle")}
function oCalBtn(o){
  if(o.est)return null;
  if(S.osymCal&&S.osymCal[o.id]){const t=el("span",{class:"mini calbtn done",title:"15 gün kala otomatik eklendi"},"Takvimde");t.insertAdjacentHTML("afterbegin",CAL_ICON);return t}
  const title="ÖSYM: "+o.name+(o.end?" (2 gün)":"");
  const a=el("a",{class:"mini calbtn",href:gcalLink({title,url:"https://gis.osym.gov.tr/"},o.name+" · "+oWhen(o),o.date,o.time||""),target:"_blank",rel:"noopener"},"Takvime ekle");
  a.insertAdjacentHTML("afterbegin",CAL_ICON);return a;
}
function renderOsym(){
  const box=$("osymView");box.textContent="";
  box.append(el("div",{class:"tyhead"},el("h2",{},"ÖSYM Takvim"),el("span",{class:"sub"},"Bugün: "+fmtLong(iso(today())))));
  const up=oUp(),ac=up.filter(o=>!S.osymAr[o.id]),ar=OSYM.filter(o=>S.osymAr[o.id]);
  const seg=el("div",{class:"seg",role:"group","aria-label":"Liste"});
  for(const[k,l,n]of[["aktif","Aktif",ac.length],["arsiv","Arşiv",ar.length]])seg.append(el("button",{type:"button","aria-pressed":String(S.ofilt===k),onclick:()=>{S.ofilt=k;render()}},l+" ("+n+")"));
  box.append(el("div",{class:"tybar"},seg,el("span",{class:"note"},"Takip: "+OSYM_EXAMS.join(" · "))));
  const tgi=el("input",{type:"checkbox"});tgi.checked=S.osymTop;
  tgi.onchange=()=>{S.osymTop=tgi.checked;try{localStorage.setItem("osymTop",S.osymTop?"1":"0")}catch(_){}render()};
  box.append(el("div",{class:"panel"},el("h2",{},"Bildirim ayarı"),el("label",{class:"chk"},tgi," Sınava 15 gün kala sağ üstte önemli uyarı göster (tüm sekmelerde)"),el("p",{class:"note"},"Uyarı, sınav arşivlenene ya da sınav günü geçene kadar sayfanın sağ üst köşesinde kalır. Uyarıya dokununca ÖSYM Takvim sekmesi açılır.")));
  if(S.ofilt==="arsiv"){
    if(!ar.length){box.append(el("div",{class:"empty"},"Arşivde sınav yok."));return}
    const ul=el("ul",{class:"upc"});
    for(const o of ar)ul.append(el("li",{},el("span",{class:"ud"},oWhen(o)),el("span",{class:"ub"},el("b",{},o.name),el("span",{class:"un"},"Arşive alındı: "+fmtLong(S.osymAr[o.id]))),el("span",{class:"acts"},oArBtn(o))));
    box.append(ul);return;
  }
  const soon=osymSoon();
  box.append(el("h2",{class:"tysec"},"Sınava 10 gün kalanlar"));
  if(soon.length){
    const ul=el("ul",{class:"list"});
    for(const o of soon){
      const meta=el("div",{class:"meta"},el("span",{class:"flag"},oLeft(o)),el("span",{class:"src"},o.ex),
        el("div",{class:"acts"},el("a",{class:"gget",href:"https://gis.osym.gov.tr/",target:"_blank",rel:"noopener"},"GİS'te görev durumuna bak"),oCalBtn(o),oArBtn(o)));
      ul.append(el("li",{class:"row prio"},el("div",{class:"d"},fmt(o.date)),el("div",{class:"b"},el("span",{class:"t",style:"font-weight:600"},o.name+(o.time?" · "+o.time:"")),meta)));
    }
    box.append(ul);
  }else{
    const nx=ac[0];
    box.append(el("div",{class:"empty"},"Şu an 10 gün içinde takip ettiğin bir sınav yok."+(nx?" En yakını: "+nx.name+", "+fmtLong(nx.date)+" ("+oDays(nx.date)+" gün).":"")));
  }
  box.append(el("h2",{class:"tysec"},"Takvim"));
  if(!ac.length)box.append(el("div",{class:"empty"},"Takvimde yaklaşan sınav kalmadı."));
  else{
    const tb=el("tbody");
    for(const o of ac){
      const d=oDays(o.date),hot=d<=10;
      tb.append(el("tr",{class:hot?"next":""},
        el("td",{class:"dt"},oWhen(o)),
        el("td",{},el("b",{},o.name),o.est?el("span",{class:"dst beklenen",style:"margin-left:6px"},"Tahmini"):null,
          el("div",{class:"note"},[o.basvuru?"Aday başvurusu: "+o.basvuru:"",o.sonuc?"Sonuç: "+fmtLong(o.sonuc):"",o.note||""].filter(Boolean).join(" · "))),
        el("td",{class:"dt"},el("span",{class:hot?"kw":"st na"},d>0?d+" gün":"bugün")),
        el("td",{class:"ac"},el("span",{class:"acts"},oCalBtn(o),oArBtn(o)))));
    }
    box.append(el("div",{class:"tswrap"},el("table",{class:"ts"},tb)));
  }
  box.append(el("p",{class:"note"},"Görevli başvuru durumu otomatik okunamıyor: ÖSYM Görevli İşlemleri Sistemi (GİS) yalnızca e-Devlet/şifre girişiyle açılıyor ve herkese açık bir duyuru listesi yok. Bu yüzden sınava 10 gün kalan oturumlar turuncu olarak üstte listelenir; görev talebini GİS'ten kontrol et. Tarihler ÖSYM 2026 ve 2027 sınav takvimlerinden alındı; \"Tahmini\" olanlar önceki dönemlere göre yazıldı. Sınav günü geçen oturumlar listeden kendiliğinden düşer. Sınava 15 gün kalınca sınav her Pazartesi 08:37'deki haftalık kontrolle Google Takviminize kendiliğinden eklenir (bir gün önce hatırlatma) ve telefonunuza bildirim gelir; tahmini tarihler eklenmez."));
  box.append(el("div",{class:"tylinks"},el("a",{href:"https://gis.osym.gov.tr/",target:"_blank",rel:"noopener"},"ÖSYM GİS"),el("a",{href:"https://www.osym.gov.tr/",target:"_blank",rel:"noopener"},"ÖSYM sınav takvimi")));
}

function renderSub(){
  const nav=$("subnav"),g=GROUPS[S.tab];nav.textContent="";nav.hidden=!g;if(!g)return;
  for(const x of g)nav.append(el("button",{type:"button",role:"tab",class:"stab","aria-selected":String(dtab()===x.id),onclick:()=>{location.hash=S.tab+"/"+x.id}},x.label));
}
function route(){
  let[h,sub]=decodeURIComponent(location.hash.slice(1)).split("/");
  const u=uiTab(h);if(u!==h){sub=h;h=u}
  S.tab=TABS.some(t=>t.id===h)?h:"spor";
  if(GROUPS[S.tab]&&GROUPS[S.tab].some(x=>x.id===sub))S.sub[S.tab]=sub;
  render();
}
window.addEventListener("hashchange",route);
route();

(async()=>{
  if(window.claude&&window.claude.use)window.claude.use("mcp").then(m=>{S.mcp=m;render()}).catch(()=>{});
  const db=await (window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null));
  if(!db){S.db=false;render();return}
  S.db=db;
  try{const u=await window.claude.use("user");if(u){const c=await u.can("data.write");if(c===false)S.canWrite=false}}catch(_){}
  db.collection("items").limit(1000).onSnapshot(snap=>{S.items=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));S.loaded=true;render()},()=>{S.loaded=true;render()});
  db.doc("config/keywords").onSnapshot(s=>{S.kw=s.exists?s.data():null;render()});
  db.doc("status/last").onSnapshot(s=>{S.status=s.exists?s.data():null;onStatus(S.status);render()});
  db.doc("status/tabs").onSnapshot(s=>{S.tabRuns=s.exists?s.data():null;render()},()=>{});
  db.doc("tayin/current").onSnapshot(s=>{S.tayin=s.exists?s.data():null;render()},()=>{});
  db.collection("tayinHist").limit(100).onSnapshot(snap=>{S.tayinHist=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));render()},()=>{});
  db.collection("tayinDonem").limit(200).onSnapshot(snap=>{S.tayinDonem=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));render()},()=>{});
  db.doc("tayin/cal").onSnapshot(s=>{S.tayinCal=s.exists?Object.assign({},s.data()):{};render()},()=>{});
  db.collection("games").limit(300).onSnapshot(snap=>{S.games=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));render()},()=>{});
  db.doc("oyun/config").onSnapshot(s=>{S.oyunCfg=s.exists?s.data():null;render()},()=>{});
  db.doc("oyun/status").onSnapshot(s=>{S.oyunStatus=s.exists?s.data():null;render()},()=>{});
  db.collection("watch").limit(300).onSnapshot(snap=>{S.watch=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));S.watchLoaded=true;render()},()=>{S.watchLoaded=true;render()});
  db.doc("izle/status").onSnapshot(s=>{S.watchStatus=s.exists?s.data():null;render()},()=>{});
  db.doc("tayin/takvimMeta").onSnapshot(s=>{S.tayinMeta=s.exists?s.data():null;render()},()=>{});
  db.doc("osym/cal").onSnapshot(s=>{S.osymCal=s.exists?Object.assign({},s.data()):{};render()},()=>{});
  db.doc("osym/arsiv").onSnapshot(s=>{S.osymAr=s.exists?Object.assign({},s.data()):{};render()},()=>{});
})();
